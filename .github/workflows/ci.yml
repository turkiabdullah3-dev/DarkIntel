name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q darkintel dashboard main.py
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: dashboard/frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
