name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: dashboard/frontend/package-lock.json}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run typecheck
        working-directory: dashboard/frontend
      - run: npm test
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: python -m compileall -q darkintel dashboard main.py tests
      - run: python -m ruff check darkintel dashboard main.py tests
      - run: python -m pyright
      - run: python -m pytest -q
