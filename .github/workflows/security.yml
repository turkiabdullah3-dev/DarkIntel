name: Security
on: [push, pull_request]
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: detect-secrets scan --all-files --exclude-files '(\.git|\.venv|\.ruff_cache|\.pytest_cache|__pycache__|node_modules|dist|coverage|\.tsbuildinfo)' --baseline .secrets.baseline
      - run: git diff --exit-code -- .secrets.baseline
      - run: python -m pip_audit -r requirements.txt
      - run: python -m bandit -r darkintel dashboard/backend main.py
  frontend-audit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: dashboard/frontend/package-lock.json}
      - run: npm ci
      - run: npm audit --omit=dev
