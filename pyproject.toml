[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "dashboard/frontend/node_modules", "dashboard/frontend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"dashboard/backend/routes/*.py" = ["B008"]

[tool.pyright]
include = ["darkintel", "dashboard/backend", "main.py"]
exclude = ["**/__pycache__", ".venv", "dashboard/frontend"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
